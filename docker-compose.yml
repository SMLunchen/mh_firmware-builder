services:
  mh-builder-api:
    build: ./backend
    image: mh-builder-api:latest
    container_name: mh-builder-api
    restart: unless-stopped
    environment:
      # Leer = Admin-Bereich deaktiviert
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - FIRMWARE_REF=${FIRMWARE_REF:-2.7}
      - FIRMWARE_REPO=${FIRMWARE_REPO:-https://github.com/meshtastic/firmware.git}
      - POW_DIFFICULTY=${POW_DIFFICULTY:-20}
      - MAX_QUEUE=${MAX_QUEUE:-5}
      - BUILDS_PER_HOUR=${BUILDS_PER_HOUR:-3}
    # Ressourcengrenzen des Build-Containers. Die Kurzform wirkt mit
    # "docker compose" auch ohne Swarm; deploy.resources.limits taete dasselbe.
    # Die Kernzahl liest der Builder aus dem cgroup und gibt sie als -j an
    # PlatformIO weiter - sie muss also nicht zusaetzlich gesetzt werden.
    cpus: ${BUILD_CPUS:-4}
    mem_limit: ${BUILD_MEMORY:-16g}
    # Ohne diese Zeile erlaubt Docker zusaetzlich Swap in Hoehe des
    # Speicherlimits - aus 16g wuerden effektiv 32g. Gleichsetzen ergibt eine
    # harte Grenze; auskommentieren, wenn Swap als Puffer erwuenscht ist.
    memswap_limit: ${BUILD_MEMORY:-16g}
    volumes:
      - builder-data:/data          # Cache der fertigen Images + Site-Config
      - builder-firmware:/firmware  # Klon des Firmware-Repos
      - builder-pio:/pio            # PlatformIO-Toolchains (gross, wiederverwendbar)
      - ./assets:/assets:ro

  mh-builder-web:
    build: ./frontend
    image: mh-builder-web:latest
    container_name: mh-builder-web
    restart: unless-stopped
    depends_on:
      - mh-builder-api
    environment:
      # CN/SAN des self-signed Zertifikats - auf den Hostnamen setzen,
      # unter dem direkt zugegriffen wird.
      - TLS_HOST=${TLS_HOST:-localhost}
    ports:
      - "${PORT:-3336}:80"          # HTTP - fuer den Reverse Proxy
      - "${PORT_TLS:-3337}:443"     # HTTPS - self-signed, fuer Direktzugriff
    volumes:
      - builder-certs:/etc/nginx/certs

volumes:
  builder-data:
  builder-firmware:
  builder-pio:
  builder-certs:
