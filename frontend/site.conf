root /usr/share/nginx/html;
index index.html;

client_max_body_size 32m;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Build-Log als SSE: nicht puffern, langer Timeout.
# Bewusst OHNE abschliessenden Slash: bei "location /api/build/" schickt nginx
# fuer die Anfrage "/api/build" einen 301 auf die Slash-Variante - und ein
# Redirect auf ein POST verliert Methode und Body.
location /api/build {
    proxy_pass http://mh-builder-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
}

location /api/ {
    proxy_pass http://mh-builder-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
}

location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/ /index.html;
}

add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
