# Gemeinsame Proxy-Regeln für beide Server-Blöcke.
# Der Build-Log-Stream (SSE) darf nicht gepuffert werden, sonst kommen die
# Zeilen erst am Ende beim Browser an.

server {
    listen 80;
    server_name _;
    include /etc/nginx/site.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;

    include /etc/nginx/site.conf;
}
